services:
  - type: web
    name: reservaya
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    dockerBuildArgs:
      - VITE_API_URL=/api
      - VITE_GOOGLE_CLIENT_ID
      - VITE_STRIPE_KEY
      - VITE_CLOUDINARY_CLOUD_NAME
      - VITE_CLOUDINARY_UPLOAD_PRESET
      - VITE_MAPS_KEY
      - VITE_GROQ_KEY
    envVars:
      - key: APP_NAME
        value: ReservaYa
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_TIMEZONE
        value: America/Bogota
      - key: APP_LOCALE
        value: es
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: reservaya-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: reservaya-db
          property: connectionString
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: true
      - key: VITE_API_URL
        value: /api
      - key: VITE_STRIPE_KEY
        sync: false
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: usd
      - key: STRIPE_RESERVATION_AMOUNT
        value: 500
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: ReservaYa
      - key: SANCTUM_STATEFUL_DOMAINS
        value: reservaya-3cbw.onrender.com
      - key: SESSION_DOMAIN
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://reservaya-3cbw.onrender.com
      - key: FRONTEND_URL
        value: https://reservaya-3cbw.onrender.com
      - key: STRIPE_SUCCESS_URL
        value: https://reservaya-3cbw.onrender.com/mis-reservas?stripe=success&session_id={CHECKOUT_SESSION_ID}
      - key: STRIPE_CANCEL_URL
        value: https://reservaya-3cbw.onrender.com/mis-reservas?stripe=cancelled
      - key: GOOGLE_REDIRECT_URI
        value: https://reservaya-3cbw.onrender.com/auth/google/callback
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: VITE_MAPS_KEY
        sync: false
      - key: VITE_GROQ_KEY
        sync: false

databases:
  - name: reservaya-db
    databaseName: reservaya
    user: reservaya
    plan: free
    region: oregon
