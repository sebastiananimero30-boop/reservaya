version: "3.9"

services:
  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: reservaya_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reservaya
      POSTGRES_USER: reservaya
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservaya"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Laravel Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reservaya_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: reservaya
      DB_USERNAME: reservaya
      DB_PASSWORD: secret
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      SANCTUM_STATEFUL_DOMAINS: "localhost:3000,localhost:5173"
      SESSION_DOMAIN: localhost
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    command: >
      sh -c "
        cd /var/www/html &&
        mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache &&
        chmod -R 775 storage bootstrap/cache &&
        composer install --no-interaction --prefer-dist &&
        php artisan key:generate --force &&
        php artisan migrate --force &&
        php artisan db:seed --force &&
        (php artisan schedule:work > storage/logs/schedule.log 2>&1 &) &&
        php artisan serve --host=0.0.0.0 --port=8000
      "

  # ── React/Vite Frontend ───────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: reservaya_frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"

volumes:
  pgdata:
