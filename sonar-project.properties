sonar.projectKey=reservayafinal_reservaya
sonar.organization=reservayafinal

sonar.projectName=ReservaYa
sonar.projectVersion=1.0

# Rutas a analizar (backend PHP + frontend React)
sonar.sources=backend/app,backend/routes,backend/database,frontend/src

# Excluir archivos que no son código fuente
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/*.test.*,**/tests/**,**/test/**,**/*.spec.*,**/storage/**,**/bootstrap/cache/**

# Configuración PHP
sonar.php.file.suffixes=.php

# Configuración JavaScript/JSX
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Encoding
sonar.sourceEncoding=UTF-8
