version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: reservaya_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-reservaya}
      POSTGRES_USER: ${DB_USERNAME:-reservaya}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-reservaya}"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: reservaya_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-reservaya}
      DB_USERNAME: ${DB_USERNAME:-reservaya}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${FRONTEND_URL}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
    volumes:
      - storage_data:/var/www/html/storage/app
    ports:
      - "8000:8000"
    command: >
      sh -c "php artisan config:cache &&
             php artisan route:cache &&
             php artisan migrate --force &&
             php-fpm"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${APP_URL}/api
    container_name: reservaya_frontend_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"

volumes:
  pgdata_prod:
  storage_data:
